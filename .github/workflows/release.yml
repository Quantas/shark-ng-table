name: Release

# Publishing a GitHub release (tag X.Y.Z, e.g. 8.0.0) publishes that version to npm.
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret is needed. See RELEASING.md.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check the tag matches the package version
        run: |
          VERSION=$(node -p "require('./projects/shark-ng-table/package.json').version")
          # Tags are plain versions (8.0.0), like earlier releases; a leading "v" is also accepted.
          if [ "${GITHUB_REF_NAME#v}" != "${VERSION}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package version ${VERSION}"
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      - name: Publish to npm
        working-directory: dist/shark-ng-table
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            npm publish --tag next
          else
            npm publish
          fi
