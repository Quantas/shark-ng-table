name: Release

# Publishing a GitHub release (tag vX.Y.Z) publishes that version to npm.
# Uses npm trusted publishing (OIDC): no NPM_TOKEN secret is needed. See RELEASING.md.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # required for npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check the tag matches the package version
        run: |
          VERSION=$(node -p "require('./projects/shark-ng-table/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::Release tag ${GITHUB_REF_NAME} does not match package version v${VERSION}"
            exit 1
          fi

      - run: npm ci
      - run: npm run build

      - name: Publish to npm
        working-directory: dist/shark-ng-table
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            npm publish --tag next
          else
            npm publish
          fi
