name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write # upload coverage to GitHub Code Quality
    steps:
      - uses: actions/checkout@v7
        with:
          # Check out the PR head (not the merge commit) so coverage line numbers match the diff
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      # Pushes to master set the baseline; pull requests are compared against it.
      # Skipped for PRs from forks, which cannot be granted code-quality: write.
      - name: Upload coverage to GitHub
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage/shark-ng-table/cobertura-coverage.xml
          language: TypeScript
          label: code-coverage/vitest
          # Set to true once the first upload succeeds (see RELEASING.md)
          fail-on-error: false
      - run: npm run build
      - name: Pack library
        run: npm pack --pack-destination ../..
        working-directory: dist/shark-ng-table
      - run: npm run build:docs
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: shark-ng-table-*.tgz
          if-no-files-found: error

  compat:
    name: Builds with Angular ${{ matrix.angular }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with peerDependencies in projects/shark-ng-table/package.json
        angular: [21, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: package
      - run: scripts/compat-check.sh ${{ matrix.angular }} "$(ls shark-ng-table-*.tgz)" "$RUNNER_TEMP"
