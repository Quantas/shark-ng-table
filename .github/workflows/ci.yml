name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - run: npm run build
      - name: Pack library
        run: npm pack --pack-destination ../..
        working-directory: dist/shark-ng-table
      - run: npm run build:docs
      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: shark-ng-table-*.tgz
          if-no-files-found: error

  compat:
    name: Builds with Angular ${{ matrix.angular }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with peerDependencies in projects/shark-ng-table/package.json
        angular: [21, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          name: package
      - run: scripts/compat-check.sh ${{ matrix.angular }} "$(ls shark-ng-table-*.tgz)" "$RUNNER_TEMP"
